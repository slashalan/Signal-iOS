name: Build Unsigned Signal IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Signal Unsigned IPA
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app
    steps:
      - name: Set Xcode version
        run: |
          echo "DEVELOPER_DIR=/Applications/Xcode_26.5.app" >> "$GITHUB_ENV"

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Build Dependencies
        run: |
          make dependencies

      - name: Build Unsigned App
        run: |
          xcodebuild build \
            -workspace Signal.xcworkspace \
            -scheme Signal \
            -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package Unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -r build/Build/Products/Release-iphoneos/Signal.app build/Payload/
          cd build
          zip -r Signal.ipa Payload
          echo "IPA packaged successfully."

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Signal-Unsigned-IPA
          path: build/Signal.ipa

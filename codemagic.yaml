workflows:
  build-unsigned-signal:
    name: Build Unsigned Signal iOS
    max_build_duration: 60
    instance_type: mac_mini_m1
    triggering:
      events:
        - push
    scripts:
      - name: Build dependencies
        script: |
          make dependencies
      - name: Build Unsigned App
        script: |
          xcodebuild build \
            -workspace Signal.xcworkspace \
            -scheme Signal \
            -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""
      - name: Package IPA
        script: |
          mkdir -p build/Payload
          cp -r build/Build/Products/Release-iphoneos/Signal.app build/Payload/
          cd build
          zip -r Signal.ipa Payload
    artifacts:
      - build/Signal.ipa
